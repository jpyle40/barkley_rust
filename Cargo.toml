[package]
name = "barkely-highlands"
version = "0.1.0"
edition = "2024"
description = "An offline command-planning adventure in Highlands park"
license = "MIT"

[features]
smoke-test = []

[dependencies]
macroquad = { version = "0.4.14", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
